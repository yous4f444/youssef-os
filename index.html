
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090a0c">
<title>Youssef OS</title>
<style>
:root{color-scheme:dark;--bg:#090a0c;--panel:#15171b;--line:#292c32;--muted:#858991;--white:#f4f4f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
button,input{font:inherit}
button{cursor:pointer;color:inherit}
button:active{transform:scale(.96)}
.app{max-width:650px;margin:auto;padding-bottom:100px}
header{padding:25px 20px 18px;display:flex;justify-content:space-between;align-items:center}
.eyebrow{font-size:10px;letter-spacing:3px;color:var(--muted)}
.logo{font-size:27px;font-weight:800;letter-spacing:-1.5px;margin-top:5px}
.logo span{color:#777}
.clock{text-align:right;font-size:19px;font-weight:700}
.clock small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
main{padding:0 16px}
.page{animation:enter .3s ease}
@keyframes enter{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.panel{background:linear-gradient(145deg,#191b20,#111215);border:1px solid var(--line);border-radius:19px;padding:16px;margin-bottom:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:11px;color:var(--muted)}
.percent{font-size:34px;font-weight:750;margin-top:8px}
.ring{width:75px;height:75px;border-radius:50%;background:conic-gradient(#eee var(--p),#303238 0);display:grid;place-items:center;position:relative}
.ring:before{content:"";position:absolute;inset:6px;background:#15171b;border-radius:50%}
.ring b{z-index:1}
.bar{height:5px;background:#303238;border-radius:9px;overflow:hidden;margin-top:15px}
.bar div{height:100%;background:#eee;transition:width .4s}
h2{font-size:22px;margin:20px 2px 5px}
.subtitle{font-size:12px;color:var(--muted);margin:0 2px 18px}
.task{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #292b30;font-size:13px}
.task:last-child{border:0}
.check{width:21px;height:21px;border:1px solid #555;border-radius:7px;background:transparent;flex-shrink:0}
.check.done{background:#eee;color:#111;border-color:#eee}
.task.done span{text-decoration:line-through;color:#777}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.metric{font-size:21px;font-weight:700;margin-top:8px}
nav{position:fixed;bottom:0;left:0;right:0;background:#0d0e10f5;border-top:1px solid #292b30;padding:9px 3px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:10}
.navbtn{flex:1;max-width:100px;border:0;background:none;color:#858991;border-radius:12px;padding:8px 2px;font-size:10px}
.navbtn span{display:block;font-size:19px;margin-bottom:4px}
.navbtn.active{background:#282a30;color:white}
.action{background:#eee;color:#111;border:0;padding:10px 14px;border-radius:11px;font-size:12px;font-weight:700}
.soft{background:#25272d;border:1px solid #363941;padding:10px 13px;border-radius:10px;font-size:12px}
.widget{background:linear-gradient(145deg,#1c1e23,#111215);border:1px solid #303239;border-radius:16px;padding:15px;position:relative;animation:enter .25s ease}
.widget .remove{position:absolute;right:10px;top:9px;background:none;border:0;color:#888;font-size:17px}
.widget-title{font-size:11px;color:#999;letter-spacing:1px}
.widget-value{font-size:24px;font-weight:750;margin-top:10px}
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:13px}
select,input{background:#22242a;border:1px solid #363941;border-radius:10px;padding:11px;color:white;width:100%;margin-top:8px}
.notice{font-size:11px;color:#999;line-height:1.5;margin-top:15px}
</style>
</head>
<body>
<div class="app">
<header>
<div><div class="eyebrow">PERSONAL OPERATING SYSTEM</div><div class="logo">Youssef<span> OS.</span></div></div>
<div class="clock"><div id="clock">--:--</div><small id="date">TODAY</small></div>
</header>
<main id="content"></main>
<nav>
<button class="navbtn active" data-page="home"><span>⌂</span>Home</button>
<button class="navbtn" data-page="habits"><span>✓</span>Habits</button>
<button class="navbtn" data-page="schedule"><span>▦</span>Schedule</button>
<button class="navbtn" data-page="nutrition"><span>◉</span>Food</button>
<button class="navbtn" data-page="gym"><span>↗</span>Gym</button>
<button class="navbtn" data-page="care"><span>✧</span>Care</button>
</nav>
</div>
<script>
const KEY="youssef-os-data-v4";
const today=()=>new Date().toLocaleDateString("en-CA");
const fresh=()=>({date:today(),done:{},habits:{},meals:{},morning:{},night:{},widgets:["progress","clock","focus","sleep"]});
let data=fresh();
try{
 const old=JSON.parse(localStorage.getItem(KEY));
 if(old)data=old;
 if(data.date!==today()){data.date=today();data.done={};data.meals={};}
}catch(e){}
const tasks=["Wake up on time","Pack school food and water","Eat lunch after school","Study or work on a project","Move your body or take a rest day","Complete night care","Put phone away before sleep"];
const habits=["Drink water regularly","Eat balanced meals","Brush teeth twice","Organize my study space","Take breaks from screens","Get enough sleep"];
const morning=["Gentle face wash","Moisturizer","SPF 30+ sunscreen","Brush teeth"];
const night=["Gentle face wash","Moisturizer","Brush teeth","Prepare school bag"];
const meals=["Breakfast · sandwich + fruit","School snack · yogurt or fruit","Lunch · protein + rice/pasta/potatoes + vegetables","Dinner · eggs, beans, cheese or another balanced meal"];
const schedule=[["05:30","Wake up"],["06:00 – 16:30","School"],["16:30","Lunch and rest"],["17:30","Gym or walk"],["18:30","Study / homework"],["20:00","Dinner and night care"],["20:45","Sleep target"]];
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){console.warn("Local save unavailable",e)}}
function checks(items,obj,kind){return items.map((x,i)=>`<div class="task ${obj[i]?"done":""}"><button class="check ${obj[i]?"done":""}" data-kind="${kind}" data-i="${i}">${obj[i]?"✓":""}</button><span>${x}</span></div>`).join("")}
function bind(){document.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{data[b.dataset.kind][b.dataset.i]=!data[b.dataset.kind][b.dataset.i];save();render(current)})}
let current="home",focusSeconds=25*60,focusInterval=null;
function widgetHTML(id){
const definitions={
progress:()=>{let n=tasks.filter((_,i)=>data.done[i]).length;return `<div class="widget"><div class="widget-title">DAILY PROGRESS</div><div class="widget-value">${Math.round(n/tasks.length*100)}%</div><div class="small">${n} / ${tasks.length} tasks</div></div>`},
clock:()=>`<div class="widget"><div class="widget-title">LIVE CLOCK</div><div class="widget-value" id="widget-clock">--:--</div><div class="small">Your local time</div></div>`,
focus:()=>`<div class="widget"><div class="widget-title">FOCUS TIMER</div><div class="widget-value" id="focus-time">25:00</div><button class="soft" onclick="toggleFocus()" id="focus-button" style="margin-top:10px">Start</button><button class="soft" onclick="resetFocus()" style="margin:10px 0 0 5px">Reset</button></div>`,
sleep:()=>`<div class="widget"><div class="widget-title">SLEEP TARGET</div><div class="widget-value">8–10 hrs</div><div class="small">Make room for recovery</div></div>`,
gym:()=>`<div class="widget"><div class="widget-title">GYM TRACKER</div><div class="widget-value">2 days / week</div><div class="small">Sunday · Wednesday</div></div>`,
study:()=>`<div class="widget"><div class="widget-title">STUDY FOCUS</div><div class="widget-value">One step</div><div class="small">Focus on your next task</div></div>`,
food:()=>`<div class="widget"><div class="widget-title">NUTRITION</div><div class="widget-value">Meal check</div><div class="small">Eat regularly and hydrate</div></div>`,
week:()=>`<div class="widget"><div class="widget-title">WEEKLY PLAN</div><div class="widget-value">2 sessions</div><div class="small">Planned schedule, not measured data</div></div>`
};
return definitions[id]?.()||"";
}
function renderWidgets(){
return `<div class="row" style="margin:22px 2px 10px"><strong>My widgets</strong><button class="soft" onclick="addWidget()">+ Add widget</button></div><div class="widgets">${data.widgets.map(id=>`<div>${widgetHTML(id)}<button class="remove" onclick="removeWidget('${id}')">×</button></div>`).join("")}</div>`;
}
function addWidget(){
const options=[["progress","Daily Progress"],["clock","Live Clock"],["focus","Focus Timer"],["sleep","Sleep Target"],["gym","Gym Tracker"],["study","Study Focus"],["food","Nutrition Reminder"],["week","Weekly Overview"]];
const remaining=options.filter(x=>!data.widgets.includes(x[0]));
if(!remaining.length){alert("All widgets are already added.");return}
const choice=prompt("Choose a widget:\n"+remaining.map((x,i)=>(i+1)+". "+x[1]).join("\n")+"\nEnter its number:");
const item=remaining[Number(choice)-1];
if(item){data.widgets.push(item[0]);save();render(current)}
}
function removeWidget(id){data.widgets=data.widgets.filter(x=>x!==id);save();render(current)}
function toggleFocus(){
if(focusInterval){clearInterval(focusInterval);focusInterval=null;document.getElementById("focus-button").textContent="Resume";return}
document.getElementById("focus-button").textContent="Pause";
focusInterval=setInterval(()=>{focusSeconds--;const el=document.getElementById("focus-time");if(el)el.textContent=fmt(focusSeconds);if(focusSeconds<=0){clearInterval(focusInterval);focusInterval=null;alert("Focus session complete!");}},1000);
}
function resetFocus(){clearInterval(focusInterval);focusInterval=null;focusSeconds=25*60;const el=document.getElementById("focus-time");if(el)el.textContent="25:00";const b=document.getElementById("focus-button");if(b)b.textContent="Start"}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function render(page="home"){
current=page;
const content=document.getElementById("content");
if(page==="home"){
let n=tasks.filter((_,i)=>data.done[i]).length,p=Math.round(n/tasks.length*100);
content.innerHTML=`<section class="page"><div class="panel" style="margin-top:8px"><div class="row"><div><div class="small">TODAY'S PROGRESS</div><div class="percent">${p}%</div><div class="small">${n} of ${tasks.length} tasks completed</div></div><div class="ring" style="--p:${p}%"><b>${p}%</b></div></div><div class="bar"><div style="width:${p}%"></div></div></div><div style="font-size:18px;font-weight:700;margin:22px 2px 10px">Daily routine</div><div class="panel">${checks(tasks,data.done,"done")}</div>${renderWidgets()}</section>`;
}else if(page==="habits"){
content.innerHTML=`<section class="page"><h2>Habits</h2><p class="subtitle">Small actions, repeated consistently.</p><div class="panel">${checks(habits,data.habits,"habits")}</div></section>`;
}else if(page==="schedule"){
content.innerHTML=`<section class="page"><h2>Schedule</h2><p class="subtitle">A simple structure for school days.</p><div class="panel">${schedule.map(([t,n])=>`<div class="task"><span class="small" style="width:105px">${t}</span><span>${n}</span></div>`).join("")}</div></section>`;
}else if(page==="nutrition"){
content.innerHTML=`<section class="page"><h2>Nutrition</h2><p class="subtitle">Balanced meals and enough energy.</p><div class="panel"><strong>Today's meals</strong>${meals.map((m,i)=>`<div class="task"><button class="check ${data.meals[i]?"done":""}" data-kind="meals" data-i="${i}">${data.meals[i]?"✓":""}</button><span>${m}</span></div>`).join("")}<p class="notice">Eat regularly, drink water, and adjust portions to your hunger. No strict food rules.</p></div></section>`;
}else if(page==="gym"){
content.innerHTML=`<section class="page"><h2>Gym</h2><p class="subtitle">A steady, safe weekly structure.</p><div class="panel"><strong>Sunday · Full body</strong><p class="small">Work with your trainer on safe technique and suitable resistance.</p><div class="bar"><div style="width:50%"></div></div><div style="margin-top:17px"><strong>Wednesday · Full body</strong></div><p class="small">Rest between sessions. Stop if something hurts and tell your trainer.</p></div><div class="panel"><strong>Other days</strong><p class="small">Walking is a good option. Saturday is a rest day.</p></div></section>`;
}else{
content.innerHTML=`<section class="page"><h2>Glow Up</h2><p class="subtitle">Simple care, consistency over perfection.</p><div class="panel"><strong>Morning care</strong>${checks(morning,data.morning,"morning")}</div><div class="panel"><strong>Night care</strong>${checks(night,data.night,"night")}</div></section>`;
}
bind();
document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
}
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>render(b.dataset.page));
function tick(){
const d=new Date();
document.getElementById("clock").textContent=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
document.getElementById("date").textContent=d.toLocaleDateString([],{weekday:"short",day:"numeric",month:"short"}).toUpperCase();
const w=document.getElementById("widget-clock");if(w)w.textContent=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
}
tick();setInterval(tick,30000);render();
</script>
</body>
</html>
